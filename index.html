<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FFCS Timetable Generator | Clash-Free Schedule Builder</title>

<meta name="description" content="Create clash-free FFCS timetables instantly. Perfect for VIT students.">

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

<header>
  <h1>FFCS Schedule Builder</h1>
  <button id="themeToggle">🌙 Toggle Theme</button>
</header>

<section class="hero">
  <h2>FFCS Timetable Generator</h2>
  <p>
    Create clash-free timetable in seconds. Select slots and generate instantly.
  </p>
</section>

<section class="card">
  <h2>Add Courses</h2>

  <div id="courseList"></div>

  <div id="colorPicker"></div>

  <button onclick="addCourse()">+ Add Course</button>
  <button onclick="generate()">Generate Timetable</button>
</section>

<section class="card">
  <h2>Weekly Timetable</h2>

  <table>
    <thead>
      <tr>
        <th>Day</th>
        <th>08:30 - 10:00</th>
        <th>10:05 - 11:35</th>
        <th>11:40 - 13:10</th>
        <th>Lunch</th>
        <th>13:15 - 14:45</th>
        <th>14:50 - 16:20</th>
        <th>16:25 - 17:55</th>
        <th>18:00 - 19:30</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

</section>

</div>

<script src="app.js"></script>
</body>
</html>

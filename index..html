<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FFCS Planner</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<header>
  <h1> FFCS Builder </h1>
  <button id="themeToggle">Toggle Theme</button>
</header>

<section class="card">
  <h2>Add Courses</h2>

  <div id="courseList"></div>

  <!-- COLOR PICKER -->
  <div class="colorPicker" id="colorPicker"></div>

  <button onclick="addCourse()">+ Add Course</button>
  <button onclick="generate()">Generate Timetable</button>
</section>

<section class="card">
  <h2>Weekly Timetable</h2>

  <table>
    <thead>
      <tr>
        <th>Day</th>
        <th>08:30 - 10:00</th>
        <th>10:05 - 11:35</th>
        <th>11:40 - 13:10</th>
        <th>Lunch</th>
        <th>13:15 - 14:45</th>
        <th>14:50 - 16:20</th>
        <th>16:25 - 17:55</th>
        <th>18:00 - 19:30</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

</section>

</div>

<script src="app.js"></script>
</body>
</html>
